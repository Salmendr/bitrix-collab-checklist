<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[[PAGE_TITLE]]</title>
    <link rel="stylesheet" href="[[OBJECT_ANALYSIS_CSS_URL]]">
</head>
<body class="oa-page">
    <main class="oa-page-shell">
        <header class="oa-page-header">
            <h1 class="oa-page-title">Анализ состояния объектов</h1>
            <span class="oa-page-note" id="oaPageNote"></span>
            <button type="button" class="oa-page-button" id="oaOpenRisks">Оценка рисков по объектам</button>
        </header>
        <section class="oa-page-content">
            <div class="oa-slice-scroll">
                <div id="oaSlice" class="oa-grid oa-grid-slice" aria-busy="true">
                    <div class="oa-loading">Загружаем объекты…</div>
                </div>
            </div>
        </section>
    </main>
    <script>
        window.OBJECT_ANALYSIS_BOOTSTRAP = Object.freeze([[PAGE_BOOTSTRAP_JSON]]);
    </script>
    <script src="[[OBJECT_ANALYSIS_UI_JS_URL]]"></script>
    <script src="[[PAGE_JS_URL]]"></script>
</body>
</html>
