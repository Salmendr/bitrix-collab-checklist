<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[[FOLDER_TITLE]]</title>
    <link rel="stylesheet" href="[[FOLDER_UPLOADS_CSS_URL]]">
    <link rel="stylesheet" href="[[FOLDER_ACTIONS_CSS_URL]]">
    <link rel="stylesheet" href="[[FOLDER_CSS_URL]]">
    <link rel="stylesheet" href="[[FOLDER_ARCHIVE_CSS_URL]]">
    <link rel="stylesheet" href="[[FOLDER_NOTIFICATIONS_CSS_URL]]">
    <link rel="stylesheet" href="[[FOLDER_ASSIGNMENT_HISTORY_CSS_URL]]">
</head>
<body class="folder-page">
    <main class="folder-shell">
        <header class="folder-header">
            <div class="folder-header-layout">
                <div class="folder-heading-block">
                    <button
                        class="folder-back-button checklist-action-button checklist-action-button-back"
                        type="button"
                        id="folderBackBtn"
                        title="Назад к чек-листу"
                        aria-label="Назад к чек-листу"
                    >
                        <span data-checklist-icon="back"></span>
                    </button>
                    <div class="folder-heading">
                        <div class="folder-checklist-title">[[FOLDER_CHECKLIST_TITLE]]</div>
                        <h1 class="folder-title">[[FOLDER_TITLE]]</h1>
                        [[FOLDER_YANDEX_PATH_HTML]]
                    </div>
                </div>
                [[FOLDER_ACTIONS_HTML]]
            </div>
            <div
                id="folderUploadProgressRegion"
                class="folder-upload-progress-region"
                hidden
            >
                <div class="folder-upload-progress-label">
                    Загрузки приложения
                </div>
                <div
                    id="folderUploadProgressCards"
                    class="upload-progress-cards folder-upload-progress-cards"
                    aria-live="polite"
                    aria-label="Текущие загрузки приложения"
                ></div>
            </div>
        </header>

        <section class="folder-content">
            <div class="folder-table-scroll">
                <table class="folder-table">
                    <colgroup class="folder-table-columns">
                        <col class="folder-table-col-file">
                        <col class="folder-table-col-size">
                        <col class="folder-table-col-date">
                        <col class="folder-table-col-user">
                        <col class="folder-table-col-actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Файл</th>
                            <th>Размер</th>
                            <th>Дата загрузки</th>
                            <th>Загрузил</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        [[FOLDER_TABLE_HTML]]
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        window.CHECKLIST_FOLDER_BOOTSTRAP = Object.freeze(
            [[FOLDER_BOOTSTRAP_JSON]]
        );
    </script>
    <script src="[[FOLDER_WINDOW_CHANNEL_JS_URL]]"></script>
    <script src="[[FOLDER_ACTION_ICONS_JS_URL]]"></script>
    <script src="[[FOLDER_CORE_JS_URL]]"></script>
    <script src="[[FOLDER_PUBLIC_SHARE_JS_URL]]"></script>
    <script src="[[FOLDER_BITRIX_USER_PICKER_JS_URL]]"></script>
    <script src="[[FOLDER_BITRIX_COMPANY_PICKER_JS_URL]]"></script>
    <script src="[[FOLDER_NOTIFICATION_UI_JS_URL]]"></script>
    <script src="[[FOLDER_NOTIFICATION_DRAFTS_JS_URL]]"></script>
    <script src="[[FOLDER_ASSIGNMENT_HISTORY_JS_URL]]"></script>
    <script src="[[FOLDER_UPLOAD_PROGRESS_JS_URL]]"></script>
    <script src="[[FOLDER_UPLOADS_JS_URL]]"></script>
    <script src="[[FOLDER_REPLACEMENT_JS_URL]]"></script>
    <script src="[[FOLDER_ARCHIVE_JS_URL]]"></script>
</body>
</html>
